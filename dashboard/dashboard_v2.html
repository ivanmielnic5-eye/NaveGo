<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaveGo — Sala de Máquinas v2</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ============================================================
           ESTILOS GENERALES (herencia del cockpit)
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #071018;
            color: #A9B8C2;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            padding: 30px 40px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            max-width: 1440px;
            width: 100%;
            background: #0D1822;
            border-radius: 24px;
            border: 1px solid #1C303B;
            padding: 30px 40px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        /* ============================================================
           HEADER
           ============================================================ */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #20313C;
            padding-bottom: 16px;
            margin-bottom: 28px;
        }

        .header-left {
            display: flex;
            align-items: baseline;
            gap: 18px;
        }

        .project-title {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #F4F8FA;
        }

        .project-sub {
            font-size: 13px;
            color: #61727D;
            letter-spacing: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13px;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.green { background: #45E68A; }
        .status-dot.yellow { background: #FFD166; }
        .status-dot.red { background: #FF5C5C; }

        /* ============================================================
           PANEL PRINCIPAL (datos en vivo)
           ============================================================ */

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        .metric-card {
            background: #101E29;
            border-radius: 16px;
            border: 1px solid #1C303B;
            padding: 20px 24px;
            transition: border-color 0.2s;
        }
        .metric-card:hover {
            border-color: #2A4A5A;
        }

        .metric-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #61727D;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 40px;
            font-weight: 300;
            color: #F4F8FA;
            letter-spacing: 1px;
        }
        .metric-value .unit {
            font-size: 18px;
            color: #00D9FF;
            margin-left: 8px;
        }
        .metric-sub {
            font-size: 14px;
            color: #A9B8C2;
            margin-top: 4px;
        }

        /* ============================================================
           DOCK (módulos)
           ============================================================ */

        .dock {
            display: flex;
            gap: 6px;
            background: #0A1620;
            border-radius: 16px;
            padding: 6px;
            margin-bottom: 24px;
            border: 1px solid #1C303B;
        }

        .dock-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #61727D;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            padding: 12px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .dock-btn:hover {
            color: #A9B8C2;
            background: #0D1A26;
        }
        .dock-btn.active {
            background: #0D1A26;
            color: #00D9FF;
            box-shadow: 0 0 0 1px #1C3A4A;
        }

        /* ============================================================
           CONTENEDOR DE CONTENIDO DINÁMICO
           ============================================================ */

        .content-panel {
            background: #0A1620;
            border-radius: 16px;
            border: 1px solid #1C303B;
            padding: 24px 28px;
            min-height: 220px;
            max-height: 400px;
            overflow-y: auto;
        }

        .content-panel h3 {
            color: #00D9FF;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            border-bottom: 1px solid #1C303B;
            padding-bottom: 8px;
        }

        .content-panel ul {
            list-style: none;
            padding: 0;
        }
        .content-panel li {
            padding: 6px 0;
            border-bottom: 1px solid #101E29;
            font-size: 14px;
            color: #A9B8C2;
        }
        .content-panel li:last-child {
            border-bottom: none;
        }
        .content-panel .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 8px;
        }
        .badge.red { background: #3A1A1A; color: #FF5C5C; }
        .badge.yellow { background: #3A2A10; color: #FFD166; }
        .badge.green { background: #0A2A1A; color: #45E68A; }

        /* ============================================================
           SCROLLBAR (estilo)
           ============================================================ */

        .content-panel::-webkit-scrollbar {
            width: 4px;
        }
        .content-panel::-webkit-scrollbar-track {
            background: #0A1620;
        }
        .content-panel::-webkit-scrollbar-thumb {
            background: #1C3A4A;
            border-radius: 4px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr 1fr;
            }
            body { padding: 16px; }
            .dashboard { padding: 20px; }
        }

        @media (max-width: 600px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard" id="app">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <span class="project-title">⚓ NaveGo</span>
                <span class="project-sub">Sala de Máquinas</span>
            </div>
            <div class="header-right">
                <span><span class="status-dot green"></span> Sistema OK</span>
                <span id="lastUpdate" style="color:#61727D;">—</span>
            </div>
        </header>

        <!-- ===== MÉTRICAS PRINCIPALES ===== -->
        <div class="main-grid">
            <div class="metric-card">
                <div class="metric-label">SOG</div>
                <div class="metric-value">0.0 <span class="unit">kn</span></div>
                <div class="metric-sub">STATIONARY</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">COG</div>
                <div class="metric-value">000°</div>
                <div class="metric-sub">N</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">POSICIÓN</div>
                <div class="metric-value" style="font-size:20px;">—</div>
                <div class="metric-sub">Última lectura</div>
            </div>
        </div>

        <!-- ===== DOCK (5 módulos) ===== -->
        <div class="dock" id="dock">
            <button class="dock-btn active" data-module="estado">ESTADO</button>
            <button class="dock-btn" data-module="trabajo">TRABAJO</button>
            <button class="dock-btn" data-module="evidencia">EVIDENCIA</button>
            <button class="dock-btn" data-module="archivos">ARCHIVOS</button>
            <button class="dock-btn" data-module="accion">ACCIÓN</button>
        </div>

        <!-- ===== CONTENIDO DINÁMICO ===== -->
        <div class="content-panel" id="contentPanel">
            <h3 id="panelTitle">ESTADO</h3>
            <div id="panelBody">
                <p style="color:#61727D; font-size:14px;">Cargando contexto...</p>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // LÓGICA DEL DASHBOARD v2
        // ============================================================

        // Referencias
        const panelTitle = document.getElementById('panelTitle');
        const panelBody = document.getElementById('panelBody');
        const lastUpdate = document.getElementById('lastUpdate');
        const dockBtns = document.querySelectorAll('.dock-btn');

        // Estado del módulo activo
        let activeModule = 'estado';
        let rawMarkdown = '';

        // ============================================================
        // 1. CARGAR MARKDOWN DESDE EL ARCHIVO
        // ============================================================

        async function loadMarkdown() {
            try {
                const res = await fetch('../governance/WORKFLOW_MEMORY.md');
                if (!res.ok) throw new Error('No se pudo cargar WORKFLOW_MEMORY.md');
                rawMarkdown = await res.text();
                // Actualizar métricas y panel
                updateMetrics(rawMarkdown);
                renderModule(activeModule, rawMarkdown);
                lastUpdate.textContent = '🔄 ' + new Date().toLocaleTimeString();
            } catch (err) {
                panelBody.innerHTML = `
                    <p style="color:#FF5C5C;">⚠️ Error: ${err.message}</p>
                    <p style="color:#61727D;">Asegúrate de que el archivo exista y el servidor esté corriendo.</p>
                `;
            }
        }

        // ============================================================
        // 2. EXTRACCIÓN DE DATOS (extracción simple por secciones)
        // ============================================================

        function extractSection(markdown, heading) {
            // Busca una sección tipo "## 📍 POSICIÓN ACTUAL"
            const regex = new RegExp(`##\\s*${heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([\\s\\S]*?)(?=\\n##\\s|$)`);
            const match = markdown.match(regex);
            return match ? match[1].trim() : '';
        }

        function parseIncidents(markdown) {
            // Busca la tabla de incidentes y extrae filas con estado 🔴 o 🟡
            const section = extractSection(markdown, '📋 REGISTRO DE INCIDENTES');
            const lines = section.split('\n');
            const rows = [];
            let inTable = false;
            for (const line of lines) {
                if (line.includes('|') && (line.includes('🔴') || line.includes('🟡') || line.includes('🟢'))) {
                    const cols = line.split('|').map(c => c.trim());
                    if (cols.length >= 5) {
                        rows.push({ fecha: cols[1], incidente: cols[2], estado: cols[5] });
                    }
                }
            }
            return rows;
        }

        // ============================================================
        // 3. ACTUALIZAR MÉTRICAS (SOG, COG, etc.)
        // ============================================================

        function updateMetrics(markdown) {
            // Extrae SOG y COG de la sección de navegación (ejemplo)
            // En el futuro, estos datos vendrán del simulador o de la app.
            // Por ahora, los dejamos estáticos o los extraemos de "ESTADO DE NAVEGACIÓN"
            // pero como no están en el Markdown, los dejamos con valores placeholder.
            // Más adelante se conectarán a Capitania.
            // (Mantenemos los valores por defecto por ahora)
        }

        // ============================================================
        // 4. RENDERIZAR MÓDULO SELECCIONADO
        // ============================================================

        function renderModule(module, markdown) {
            activeModule = module;

            // Actualizar botones activos
            dockBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.module === module);
            });

            let title = module.toUpperCase();
            let body = '';

            switch (module) {
                case 'estado':
                    title = 'ESTADO';
                    const pos = extractSection(markdown, '📍 POSICIÓN ACTUAL');
                    const ruta = extractSection(markdown, '🗺️ MAPA DE RUTA');
                    body = `
                        <div style="display:grid; gap:12px;">
                            <div><strong>Posición:</strong><br>${pos.replace(/\n/g, '<br>')}</div>
                            <div><strong>Ruta:</strong><br>${ruta.replace(/\n/g, '<br>')}</div>
                        </div>
                    `;
                    break;

                case 'trabajo':
                    title = 'TRABAJO';
                    const incidents = parseIncidents(markdown);
                    if (incidents.length === 0) {
                        body = '<p style="color:#45E68A;">✅ No hay incidentes abiertos.</p>';
                    } else {
                        let items = incidents.map(inc => {
                            const badge = inc.estado.includes('🔴') ? 'red' : inc.estado.includes('🟡') ? 'yellow' : 'green';
                            return `<li><span class="badge ${badge}">${inc.estado}</span> ${inc.incidente} <span style="color:#61727D; font-size:12px;">(${inc.fecha})</span></li>`;
                        }).join('');
                        body = `<ul>${items}</ul>`;
                    }
                    break;

                case 'evidencia':
                    title = 'EVIDENCIA';
                    const reglas = extractSection(markdown, '🧠 LECCIONES APRENDIDAS');
                    body = `
                        <div style="font-size:14px; line-height:1.7;">
                            ${reglas.replace(/\n/g, '<br>')}
                        </div>
                    `;
                    break;

                case 'archivos':
                    title = 'ARCHIVOS';
                    // Lista de archivos clave (se puede extraer de notas adicionales)
                    body = `
                        <ul>
                            <li>📄 <code>WORKFLOW_MEMORY.md</code> — Fuente de verdad</li>
                            <li>🌐 <code>dashboard/index.html</code> — Sala de máquinas v1</li>
                            <li>🌐 <code>dashboard/dashboard_v2.html</code> — Sala de máquinas v2</li>
                            <li>📁 <code>governance/</code> — Documentación de gobernanza</li>
                            <li>📁 <code>NaveGoLocal/</code> — Código fuente de la app</li>
                            <li>📁 <code>simulador_limpio/</code> — Simulador Godot</li>
                        </ul>
                    `;
                    break;

                case 'accion':
                    title = 'ACCIÓN';
                    body = `
                        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;">
                            <button style="background:#0D1A26; border:1px solid #1C303B; color:#A9B8C2; padding:10px 20px; border-radius:8px; cursor:pointer;">▶️ Iniciar captura</button>
                            <button style="background:#0D1A26; border:1px solid #1C303B; color:#A9B8C2; padding:10px 20px; border-radius:8px; cursor:pointer;">⏹️ Detener captura</button>
                            <button style="background:#0D1A26; border:1px solid #1C303B; color:#A9B8C2; padding:10px 20px; border-radius:8px; cursor:pointer;">📊 Ver logs</button>
                            <button style="background:#0D1A26; border:1px solid #1C303B; color:#A9B8C2; padding:10px 20px; border-radius:8px; cursor:pointer;">🔄 Recargar contexto</button>
                        </div>
                        <p style="color:#61727D; margin-top:16px; font-size:13px;">Estas acciones se conectarán con Capitania en futuras versiones.</p>
                    `;
                    break;

                default:
                    body = '<p style="color:#61727D;">Módulo no reconocido.</p>';
            }

            panelTitle.textContent = title;
            panelBody.innerHTML = body;
        }

        // ============================================================
        // 5. EVENTOS
        // ============================================================

        // Cambio de módulo al hacer clic en el dock
        dockBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const module = this.dataset.module;
                renderModule(module, rawMarkdown);
            });
        });

        // ============================================================
        // 6. INICIO
        // ============================================================

        // Cargar al abrir
        loadMarkdown();

        // Recargar cada 30 segundos (opcional)
        setInterval(loadMarkdown, 30000);
    </script>
</body>
</html>
